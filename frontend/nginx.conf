# Con docker compose nginx fa anche da reverse proxy verso l'api.
# In Kubernetes (settimana 3) questo ruolo passa all'Ingress: /api e /r andranno direttamente al Service dell'api.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ { proxy_pass http://api:8080; }
    location /r/   { proxy_pass http://api:8080; }
    location /version { proxy_pass http://api:8080; }

    location / { try_files $uri /index.html; }
}
